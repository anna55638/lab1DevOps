# nginx — обратный прокси (reverse proxy) перед Flask-приложением.
# Снаружи открыт только порт 80 nginx; контейнер app доступен лишь внутри сети Docker.

upstream dance_app {
    # "app" — имя сервиса из docker-compose.yml, Docker DNS превращает его в IP контейнера
    server app:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # проверка самого nginx (без обращения к приложению)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # все остальные запросы передаются в приложение
    location / {
        proxy_pass         http://dance_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
